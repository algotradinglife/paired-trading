[project]
name = "paired-trading"
version = "0.1.0"
description = "Paired-trading engine — underlying + options joint analysis grounded in Song Jianyi's K-line momentum theory, Al Brooks' price action, and Xiao Chunxin's options timing"
requires-python = ">=3.13"
dependencies = [
    "akshare>=1.18.63",
    "exchange-calendars>=4.13.2",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pyarrow>=21.0",
    "pydantic>=2.13.4",
    "quant-cli",
    "requests>=2.34.2",
    "scipy>=1.17.1",
    "tqsdk>=3.9.9",
    "yfinance>=1.3.0",
]

[tool.uv.sources]
# non-editable: editable .pth puts the quant repo root on sys.path, where its
# tests/ (regular pkg) shadows ours and legacy quant_data/ leaks in
quant-cli = { path = "../../../../quant" }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.hatch.build.targets.wheel]
packages = ["engine", "data"]
